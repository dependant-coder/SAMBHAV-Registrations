    <!-- Animation gate. Runs before first paint. Skipped for prefers-reduced-motion. -->
    <script>
      if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.classList.add('js-anim');
      setTimeout(function () { if (!window.__sambhavAnimReady) document.documentElement.classList.remove('js-anim'); }, 4000);
    </script>
